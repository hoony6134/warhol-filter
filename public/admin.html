<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>워홀 콜라주</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap">
<style>
  :root {
    --ink: #1b1b1b; --paper: #fffaf0;
    --pink: #ff4fa0; --yellow: #ffd400; --cyan: #18c3d6; --orange: #ff7a1a;
    --display: "Black Han Sans", "Apple SD Gothic Neo", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ink); color: var(--paper); font-family: var(--display); }
  #grid { position: fixed; inset: 0; display: grid; align-content: center; justify-content: center; gap: 0; }
  #grid img { width: 100%; height: 100%; object-fit: cover; display: block; animation: pop .35s ease-out; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } }

  #empty {
    position: fixed; inset: 0; display: grid; place-content: center; gap: 3vh; text-align: center; color: var(--ink);
    background: radial-gradient(rgba(255, 79, 160, .55) 22%, transparent 24%) 0 0 / 22px 22px, var(--yellow);
  }
  #empty .big { font-size: 9vw; line-height: 1; color: var(--paper); -webkit-text-stroke: .4vw var(--ink); paint-order: stroke fill; text-shadow: .8vw .8vw 0 var(--ink); }
  #empty .url { font-size: 4vw; background: var(--ink); color: var(--yellow); padding: 1.2vh 2vw; border-radius: 1vw; justify-self: center; }
  #empty .sub { font-size: 2.2vw; }

  #bar { position: fixed; right: 14px; bottom: 14px; display: flex; gap: 10px; align-items: center; opacity: .2; transition: opacity .2s; }
  #bar:hover, #bar:focus-within { opacity: 1; }
  #bar button, #count { font: 18px/1 var(--display); padding: 10px 14px; border: 3px solid var(--ink); border-radius: 10px; background: var(--paper); color: var(--ink); box-shadow: 4px 4px 0 var(--ink); }
  #bar button { cursor: pointer; }
  #bar button.danger { background: var(--pink); color: #fff; }
  #count { background: var(--yellow); }

  #votes {
    position: fixed; inset: 6vh 7vw; display: flex; flex-direction: column; justify-content: center;
    background: var(--paper); color: var(--ink); border: .5vw solid var(--ink); border-radius: 2vw; padding: 4vh 4vw;
    box-shadow: 1.6vw 1.6vw 0 var(--pink);
  }
  #votes h2 { margin: 0 0 2.5vh; font-weight: 400; font-size: 3.6vw; line-height: 1.1; }
  #votes h2 + div + h2 { margin-top: 5vh; font-size: 2.6vw; }
  .row { display: grid; grid-template-columns: 17vw 1fr 8vw; gap: 1.5vw; align-items: center; margin: 1.3vh 0; font-size: 2.2vw; }
  .row b { font-weight: 400; text-align: right; }
  .track { height: 5vh; background: #eee; border: .3vw solid var(--ink); border-radius: .8vw; overflow: hidden; }
  .fill { height: 100%; transition: width .5s; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="grid"></div>
<div id="empty">
  <div class="big">셀카를 올려 주세요</div>
  <div class="url">warhol-filter.scian.xyz</div>
  <div class="sub" id="emptySub">QR을 찍으면 바로 열려요</div>
</div>

<section id="votes" hidden aria-live="polite">
  <h2>이 사진도 워홀의 작품일까?</h2>
  <div id="answers"></div>
  <h2>‘아니다’라고 답한 사람들, 뭐가 빠졌을까</h2>
  <div id="missing"></div>
</section>

<div id="bar">
  <span id="count">0장</span>
  <button id="toggle">투표 결과 (V)</button>
  <button id="wipe" class="danger">전체 삭제</button>
</div>

<script>
const key = new URLSearchParams(location.search).get('key') || '';
const api = (path, opts = {}) => fetch(path, { ...opts, headers: { 'x-key': key, ...(opts.headers || {}) } });
const $ = (id) => document.getElementById(id);
const grid = $('grid');
let lastId = 0;

function layout() {
  const n = grid.children.length, W = innerWidth, H = innerHeight;
  $('empty').hidden = n > 0;
  $('count').textContent = `${n}장`;
  if (!n) return;
  // Pick the column count that makes square cells as large as possible.
  let best = 1, bestSize = 0;
  for (let c = 1; c <= n; c++) {
    const size = Math.min(W / c, H / Math.ceil(n / c));
    if (size > bestSize) { bestSize = size; best = c; }
  }
  grid.style.gridTemplateColumns = `repeat(${best}, ${Math.floor(bestSize)}px)`;
  grid.style.gridAutoRows = `${Math.floor(bestSize)}px`;
}

async function pollPhotos() {
  const res = await api(`/api/admin/photos?after=${lastId}`);
  if (res.status === 403) { $('emptySub').textContent = '주소 끝에 ?key=… 를 붙여 주세요'; return false; }
  const ids = await res.json();
  for (const id of ids) {
    const img = new Image();
    img.alt = `참여자 사진 ${id}`;
    img.decoding = 'async';
    img.src = `/api/admin/photo/${id}?key=${encodeURIComponent(key)}`;
    grid.append(img);
    lastId = id;
  }
  if (ids.length) layout();
  return true;
}

const LABELS = { yes: '그렇다', no: '아니다', unsure: '잘 모르겠다', choice: '고른 이유', context: '시대의 맥락', hand: '작가의 손' };
const COLORS = { yes: 'var(--cyan)', no: 'var(--pink)', unsure: 'var(--yellow)', choice: 'var(--orange)', context: 'var(--cyan)', hand: 'var(--yellow)' };
function bars(el, counts) {
  const total = Object.values(counts).reduce((a, b) => a + b, 0) || 1;
  el.innerHTML = Object.entries(counts).map(([k, n]) => {
    const pct = Math.round((n / total) * 100);
    return `<div class="row"><span>${LABELS[k]}</span><div class="track"><div class="fill" style="width:${pct}%;background:${COLORS[k]}"></div></div><b>${pct}%</b></div>`;
  }).join('');
}

async function pollVotes() {
  const rows = await (await api('/api/admin/votes')).json();
  const answers = { yes: 0, no: 0, unsure: 0 }, missing = { choice: 0, context: 0, hand: 0 };
  for (const r of rows) {
    answers[r.answer] += r.n;
    if (r.missing) missing[r.missing] += r.n;
  }
  bars($('answers'), answers);
  bars($('missing'), missing);
}

async function tick() {
  try {
    if (!(await pollPhotos())) return;
    if (!$('votes').hidden) await pollVotes();
  } catch (e) { console.warn(e); }
  setTimeout(tick, 2000);
}

function toggleVotes() {
  $('votes').hidden = !$('votes').hidden;
  if (!$('votes').hidden) pollVotes().catch(console.warn);
}
$('toggle').addEventListener('click', toggleVotes);
addEventListener('keydown', (e) => { if (e.key === 'v' || e.key === 'V') toggleVotes(); });
addEventListener('resize', layout);

$('wipe').addEventListener('click', async () => {
  if (!confirm('사진과 투표를 모두 지울까요? 되돌릴 수 없어요.')) return;
  const res = await api('/api/admin/all', { method: 'DELETE' });
  if (!res.ok) return alert('지우지 못했어요');
  grid.replaceChildren(); lastId = 0; layout();
  if (!$('votes').hidden) pollVotes();
});

layout();
tick();
</script>
</body>
</html>
