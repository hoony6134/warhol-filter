<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>워홀 콜라주</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap">
<style>
  :root {
    --ink: #1b1b1b; --paper: #fffaf0;
    --pink: #ff4fa0; --yellow: #ffd400; --cyan: #18c3d6; --orange: #ff7a1a;
    --display: "Black Han Sans", "Apple SD Gothic Neo", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ink); color: var(--paper); font-family: var(--display); }
  #grid { position: fixed; inset: 0; display: grid; align-content: center; justify-content: center; gap: 0; }
  #grid img { width: 100%; height: 100%; object-fit: cover; display: block; animation: pop .35s ease-out; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } }

  /* Waiting screen: QR card on the left, call to action on the right. */
  #empty {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; gap: 5vw; padding: 6vh 6vw; color: var(--ink);
    background: radial-gradient(rgba(255, 79, 160, .55) 22%, transparent 24%) 0 0 / 22px 22px, var(--yellow);
    /* A cover layer over the live collage: it irises shut/open instead of being removed. */
    --ease: cubic-bezier(.7, 0, .2, 1);
    clip-path: circle(75% at 50% 50%);
    transition: clip-path .6s var(--ease), visibility 0s;
  }
  #empty.off { clip-path: circle(0% at 50% 50%); visibility: hidden; pointer-events: none; transition: clip-path .6s var(--ease), visibility 0s .6s; }
  #empty .qr, #empty .copy { transition: transform .6s var(--ease); }
  #empty.off .qr { transform: scale(.7) rotate(-6deg); }
  #empty.off .copy { transform: scale(.85) rotate(4deg); }
  @media (prefers-reduced-motion: reduce) { #empty, #empty.off, #empty .qr, #empty .copy { transition: none; } }
  #empty .qr {
    flex: none; width: min(70vh, 42vw); aspect-ratio: 1; padding: min(1.6vh, 1vw);
    background: var(--yellow); border: min(1vh, .6vw) solid var(--ink); border-radius: min(2.4vh, 1.4vw);
    box-shadow: min(2.4vh, 1.4vw) min(2.4vh, 1.4vw) 0 var(--ink);
  }
  #empty .qr img { display: block; width: 100%; height: 100%; }
  #empty .copy { display: flex; flex-direction: column; align-items: flex-start; gap: 4vh; }
  #empty .big { font-size: min(7.5vw, 13vh); line-height: 1.05; color: var(--paper); -webkit-text-stroke: min(.4vw, .7vh) var(--ink); paint-order: stroke fill; text-shadow: min(.8vw, 1.4vh) min(.8vw, 1.4vh) 0 var(--ink); }
  #empty .url {
    --nudge: .09em; font-size: min(3.2vw, 5.6vh); line-height: 1; white-space: nowrap; background: var(--ink); color: var(--yellow);
    padding: calc(.45em + var(--nudge)) .7em calc(.45em - var(--nudge)); border-radius: .3em; box-shadow: .18em .18em 0 var(--pink);
  }
  #empty .sub { font-size: min(2vw, 3.5vh); }

  #bar { position: fixed; right: 14px; bottom: 14px; display: flex; gap: 10px; align-items: center; opacity: .2; transition: opacity .2s; }
  #bar:hover, #bar:focus-within { opacity: 1; }
  #bar button, #count { font: 18px/1 var(--display); padding: 10px 14px; border: 3px solid var(--ink); border-radius: 10px; background: var(--paper); color: var(--ink); box-shadow: 4px 4px 0 var(--ink); }
  #bar button { cursor: pointer; }
  #bar button.danger { background: var(--pink); color: #fff; }
  #count { background: var(--yellow); }

  #votes {
    position: fixed; inset: 6vh 7vw; display: flex; flex-direction: column; justify-content: center;
    background: var(--paper); color: var(--ink); border: .5vw solid var(--ink); border-radius: 2vw; padding: 4vh 4vw;
    box-shadow: 1.6vw 1.6vw 0 var(--pink);
    /* Slaps on like a sticker (overshoot), peels off fast. */
    transition: transform .5s cubic-bezier(.34, 1.56, .64, 1), opacity .2s, visibility 0s;
  }
  #votes.off {
    transform: scale(.5) rotate(-8deg); opacity: 0; visibility: hidden; pointer-events: none;
    transition: transform .3s cubic-bezier(.7, 0, .84, 0), opacity .3s, visibility 0s .3s;
  }
  @media (prefers-reduced-motion: reduce) { #votes, #votes.off { transition: none; } }
  #votes h2 { margin: 0 0 2.5vh; font-weight: 400; font-size: 3.6vw; line-height: 1.1; }
  #votes h2 + div + h2 { margin-top: 5vh; font-size: 2.6vw; }
  .row { display: grid; grid-template-columns: 17vw 1fr 8vw; gap: 1.5vw; align-items: center; margin: 1.3vh 0; font-size: 2.2vw; }
  .row b { font-weight: 400; text-align: right; }
  .track { height: 5vh; background: #eee; border: .3vw solid var(--ink); border-radius: .8vw; overflow: hidden; }
  .fill { height: 100%; transition: width .5s; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="grid"></div>
<div id="empty">
  <div class="qr"><img src="/qr.svg" alt="warhol-filter.scian.xyz 로 연결되는 QR 코드"></div>
  <div class="copy">
    <div class="big">셀카를<br>올려 주세요</div>
    <div class="url">warhol-filter.scian.xyz</div>
    <div class="sub" id="emptySub">QR을 찍으면 바로 열려요</div>
  </div>
</div>

<section id="votes" class="off" aria-live="polite">
  <h2>이 사진도 워홀의 작품일까요?</h2>
  <div id="answers"></div>
  <h2>그렇다면 무엇이 빠졌을까?</h2>
  <div id="missing"></div>
</section>

<div id="bar">
  <span id="count">0장</span>
  <button id="landing">QR 화면 (S)</button>
  <button id="toggle">투표 결과 (V)</button>
  <button id="wipe" class="danger">전체 삭제</button>
</div>

<script>
const key = new URLSearchParams(location.search).get('key') || '';
const api = (path, opts = {}) => fetch(path, { ...opts, headers: { 'x-key': key, ...(opts.headers || {}) } });
const $ = (id) => document.getElementById(id);
const grid = $('grid');
let lastId = 0;
let showLanding = false; // S: bring the QR screen back over the collage

function layout() {
  const n = grid.children.length, W = innerWidth, H = innerHeight;
  $('empty').classList.toggle('off', n > 0 && !showLanding);
  $('count').textContent = `${n}장`;
  if (!n) return;
  // Pick the column count that makes square cells as large as possible.
  let best = 1, bestSize = 0;
  for (let c = 1; c <= n; c++) {
    const size = Math.min(W / c, H / Math.ceil(n / c));
    if (size > bestSize) { bestSize = size; best = c; }
  }
  grid.style.gridTemplateColumns = `repeat(${best}, ${Math.floor(bestSize)}px)`;
  grid.style.gridAutoRows = `${Math.floor(bestSize)}px`;
}

async function pollPhotos() {
  const res = await api(`/api/admin/photos?after=${lastId}`);
  if (res.status === 403) { $('emptySub').textContent = '주소 끝에 ?key=… 를 붙여 주세요'; return false; }
  const ids = await res.json();
  for (const id of ids) {
    const img = new Image();
    img.alt = `참여자 사진 ${id}`;
    img.decoding = 'async';
    img.src = `/api/admin/photo/${id}?key=${encodeURIComponent(key)}`;
    grid.append(img);
    lastId = id;
  }
  if (ids.length) layout();
  return true;
}

const LABELS = { yes: '그렇다', no: '아니다', unsure: '잘 모르겠다', choice: '고른 이유', context: '시대의 맥락', hand: '작가의 손길' };
const COLORS = { yes: 'var(--cyan)', no: 'var(--pink)', unsure: 'var(--yellow)', choice: 'var(--orange)', context: 'var(--cyan)', hand: 'var(--yellow)' };
function bars(el, counts) {
  const total = Object.values(counts).reduce((a, b) => a + b, 0) || 1;
  el.innerHTML = Object.entries(counts).map(([k, n]) => {
    const pct = Math.round((n / total) * 100);
    return `<div class="row"><span>${LABELS[k]}</span><div class="track"><div class="fill" style="width:${pct}%;background:${COLORS[k]}"></div></div><b>${pct}%</b></div>`;
  }).join('');
}

async function pollVotes() {
  const rows = await (await api('/api/admin/votes')).json();
  const answers = { yes: 0, no: 0, unsure: 0 }, missing = { choice: 0, context: 0, hand: 0 };
  for (const r of rows) {
    answers[r.answer] += r.n;
    if (r.missing) missing[r.missing] += r.n;
  }
  bars($('answers'), answers);
  bars($('missing'), missing);
}

async function tick() {
  try {
    if (!(await pollPhotos())) return;
    if (!$('votes').classList.contains('off')) await pollVotes();
  } catch (e) { console.warn(e); }
  setTimeout(tick, 2000);
}

function toggleVotes() {
  $('votes').classList.toggle('off');
  if (!$('votes').classList.contains('off')) pollVotes().catch(console.warn);
}
function toggleLanding() { showLanding = !showLanding; layout(); }
$('toggle').addEventListener('click', toggleVotes);
$('landing').addEventListener('click', toggleLanding);
// e.code, not e.key: with the Korean keyboard active, S and V arrive as 'ㄴ' and 'ㅍ'.
addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.repeat) return;
  if (e.code === 'KeyV') toggleVotes();
  if (e.code === 'KeyS') toggleLanding();
});
addEventListener('resize', layout);

$('wipe').addEventListener('click', async () => {
  if (!confirm('사진과 투표를 모두 지울까요? 되돌릴 수 없어요.')) return;
  const res = await api('/api/admin/all', { method: 'DELETE' });
  if (!res.ok) return alert('지우지 못했어요');
  grid.replaceChildren(); lastId = 0; layout();
  if (!$('votes').classList.contains('off')) pollVotes();
});

layout();
tick();
</script>
</body>
</html>
