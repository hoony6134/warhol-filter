<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>워홀 콜라주</title>
<style>
  :root { --ink: #1b1b1b; --pink: #e8508c; --yellow: #f7d23e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ink); color: #fff; font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; overflow: hidden; }
  #grid { position: fixed; inset: 0; display: grid; align-content: center; justify-content: center; }
  #grid img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #empty { position: fixed; inset: 0; display: grid; place-items: center; font-size: 3vw; font-weight: 800; color: var(--yellow); }
  #bar { position: fixed; right: 12px; bottom: 12px; display: flex; gap: 8px; align-items: center; opacity: .25; transition: opacity .2s; }
  #bar:hover, #bar:focus-within { opacity: 1; }
  #bar button { font: inherit; font-weight: 700; padding: 8px 12px; border: 2px solid #fff; border-radius: 8px; background: var(--ink); color: #fff; cursor: pointer; }
  #bar button.danger { border-color: var(--pink); color: var(--pink); }
  #count { font-weight: 700; }
  #votes { position: fixed; inset: 6vh 8vw; background: #fff; color: var(--ink); border: 6px solid var(--ink); border-radius: 24px; padding: 4vh 4vw; box-shadow: 16px 16px 0 var(--pink); }
  #votes h2 { margin: 0 0 2vh; font-size: 3.2vw; }
  .row { display: grid; grid-template-columns: 16vw 1fr 8vw; gap: 1.5vw; align-items: center; margin: 1.4vh 0; font-size: 2vw; font-weight: 700; }
  .track { height: 4.5vh; background: #eee; border-radius: 8px; overflow: hidden; }
  .fill { height: 100%; background: var(--pink); transition: width .4s; }
  .sub .fill { background: var(--yellow); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="grid"></div>
<div id="empty">셀카를 기다리는 중…</div>

<section id="votes" hidden aria-live="polite">
  <h2>이 사진은 워홀의 작품일까?</h2>
  <div id="answers"></div>
  <h2 style="margin-top:4vh">‘아니다’ — 무엇이 빠졌나</h2>
  <div id="missing" class="sub"></div>
</section>

<div id="bar">
  <span id="count">0장</span>
  <button id="toggle">투표 결과 (V)</button>
  <button id="wipe" class="danger">전체 삭제</button>
</div>

<script>
const key = new URLSearchParams(location.search).get('key') || '';
const api = (path, opts = {}) => fetch(path, { ...opts, headers: { 'x-key': key, ...(opts.headers || {}) } });
const $ = (id) => document.getElementById(id);
const grid = $('grid');
let lastId = 0;

function layout() {
  const n = grid.children.length, W = innerWidth, H = innerHeight;
  $('empty').hidden = n > 0;
  $('count').textContent = `${n}장`;
  if (!n) return;
  // Pick the column count that makes square cells as large as possible.
  let best = 1, bestSize = 0;
  for (let c = 1; c <= n; c++) {
    const size = Math.min(W / c, H / Math.ceil(n / c));
    if (size > bestSize) { bestSize = size; best = c; }
  }
  grid.style.gridTemplateColumns = `repeat(${best}, ${bestSize}px)`;
  grid.style.gridAutoRows = `${bestSize}px`;
}

async function pollPhotos() {
  const res = await api(`/api/admin/photos?after=${lastId}`);
  if (res.status === 403) { $('empty').textContent = '관리자 키가 필요합니다 (?key=…)'; return false; }
  const ids = await res.json();
  for (const id of ids) {
    const img = new Image();
    img.alt = `참여자 사진 ${id}`;
    img.src = `/api/admin/photo/${id}?key=${encodeURIComponent(key)}`;
    grid.append(img);
    lastId = id;
  }
  if (ids.length) layout();
  return true;
}

const LABELS = { yes: '그렇다', no: '아니다', unsure: '모르겠다', choice: '고른 이유', context: '시대적 맥락', hand: '작가의 손' };
function bars(el, counts) {
  const total = Object.values(counts).reduce((a, b) => a + b, 0) || 1;
  el.innerHTML = Object.entries(counts).map(([k, n]) => {
    const pct = Math.round((n / total) * 100);
    return `<div class="row"><span>${LABELS[k]}</span><div class="track"><div class="fill" style="width:${pct}%"></div></div><span>${pct}%</span></div>`;
  }).join('');
}

async function pollVotes() {
  const rows = await (await api('/api/admin/votes')).json();
  const answers = { yes: 0, no: 0, unsure: 0 }, missing = { choice: 0, context: 0, hand: 0 };
  for (const r of rows) {
    answers[r.answer] += r.n;
    if (r.missing) missing[r.missing] += r.n;
  }
  bars($('answers'), answers);
  bars($('missing'), missing);
}

async function tick() {
  try {
    if (!(await pollPhotos())) return;
    if (!$('votes').hidden) await pollVotes();
  } catch (e) { console.warn(e); }
  setTimeout(tick, 2000);
}

function toggleVotes() {
  $('votes').hidden = !$('votes').hidden;
  if (!$('votes').hidden) pollVotes().catch(console.warn);
}
$('toggle').addEventListener('click', toggleVotes);
addEventListener('keydown', (e) => { if (e.key === 'v' || e.key === 'V') toggleVotes(); });
addEventListener('resize', layout);

$('wipe').addEventListener('click', async () => {
  if (!confirm('사진과 투표를 모두 삭제할까요? 되돌릴 수 없습니다.')) return;
  const res = await api('/api/admin/all', { method: 'DELETE' });
  if (!res.ok) return alert('삭제 실패');
  grid.replaceChildren(); lastId = 0; layout();
  if (!$('votes').hidden) pollVotes();
});

tick();
</script>
</body>
</html>
