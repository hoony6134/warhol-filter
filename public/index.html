<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>워홀 필터</title>
<style>
  :root { --ink: #1b1b1b; --pink: #e8508c; --yellow: #f7d23e; --teal: #3ec6c9; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; background: var(--yellow); color: var(--ink); }
  main { max-width: 480px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 2rem; margin: 0 0 8px; letter-spacing: -0.02em; }
  p { line-height: 1.5; }
  .btn { display: block; width: 100%; padding: 16px; margin: 12px 0; font-size: 1.1rem; font-weight: 700; text-align: center;
         border: 3px solid var(--ink); border-radius: 12px; background: #fff; color: var(--ink); cursor: pointer; }
  .btn.primary { background: var(--pink); color: #fff; }
  .btn:disabled { opacity: .5; }
  canvas { width: 100%; aspect-ratio: 1; border: 3px solid var(--ink); border-radius: 12px; background: #fff; display: block; }
  .note { font-size: .9rem; background: #fff; border: 2px solid var(--ink); border-radius: 8px; padding: 10px 12px; }
  [hidden] { display: none !important; }
  input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
</style>
</head>
<body>
<main>
  <section id="shoot">
    <h1>워홀 필터</h1>
    <p>셀카 한 장을 찍어 주세요. 얼굴 대신 손이나 물건도 괜찮아요.</p>
    <p id="inapp" class="note" hidden>카카오톡 등 앱 안의 브라우저에서는 카메라가 열리지 않을 수 있어요. 오른쪽 위 메뉴에서 <b>Safari / Chrome으로 열기</b>를 눌러 주세요.</p>
    <label class="btn primary" for="cam">📷 사진 찍기</label>
    <input id="cam" type="file" accept="image/*" capture="user">
    <label class="btn" for="pick">앨범에서 고르기</label>
    <input id="pick" type="file" accept="image/*">
    <p class="note">사진은 발표 중에만 화면에 쓰이고, 수업이 끝나면 모두 삭제합니다.</p>
  </section>

  <section id="preview" hidden>
    <canvas id="out" width="600" height="600" aria-label="워홀 필터를 적용한 사진"></canvas>
    <p id="status" role="status">워홀의 공정을 실행하는 중…</p>
    <button id="send" class="btn primary" disabled>화면으로 보내기</button>
    <button id="retake" class="btn">다시 찍기</button>
  </section>

  <section id="vote" hidden>
    <h1>질문</h1>
    <p>방금 만든 사진은 워홀의 방식으로 만들어졌습니다.<br><b>이 사진은 워홀의 작품일까요?</b></p>
    <button class="btn" data-answer="yes">그렇다</button>
    <button class="btn" data-answer="no">아니다</button>
    <button class="btn" data-answer="unsure">모르겠다</button>
  </section>

  <section id="missing" hidden>
    <h1>그렇다면</h1>
    <p><b>무엇이 빠졌을까요?</b></p>
    <button class="btn" data-missing="choice">무엇을 고를지 정한 이유</button>
    <button class="btn" data-missing="context">시대적 맥락</button>
    <button class="btn" data-missing="hand">작가의 손</button>
  </section>

  <section id="done" hidden>
    <h1>고마워요!</h1>
    <p>앞 화면을 봐 주세요.</p>
  </section>
</main>

<script type="module">
import { luminance, levels, renderTile, PALETTES, OFFSETS } from './filter.js';

const S = 300; // tile size; output is 2×2 tiles
const $ = (id) => document.getElementById(id);
const show = (id) => document.querySelectorAll('main > section').forEach((s) => (s.hidden = s.id !== id));

let cid;
try { cid = localStorage.getItem('cid') || crypto.randomUUID(); localStorage.setItem('cid', cid); }
catch { cid = crypto.randomUUID(); }

if (/KAKAOTALK|Instagram|FBAN|FBAV|Line\//i.test(navigator.userAgent)) $('inapp').hidden = false;

// Person segmentation (step ①). Loaded in the background; on any failure we skip it.
const segmenterReady = (async () => {
  const v = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
  const { FilesetResolver, ImageSegmenter } = await import(`${v}/vision_bundle.mjs`);
  const fileset = await FilesetResolver.forVisionTasks(`${v}/wasm`);
  return ImageSegmenter.createFromOptions(fileset, {
    baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite' },
    runningMode: 'IMAGE', outputConfidenceMasks: true, outputCategoryMask: false,
  });
})().catch((e) => { console.warn('segmenter unavailable', e); return null; });

async function personMask(canvas) {
  const seg = await segmenterReady;
  if (!seg) return null;
  try {
    const res = seg.segment(canvas);
    const m = res.confidenceMasks?.[0];
    if (!m) return null;
    const src = m.getAsFloat32Array(), mw = m.width, mh = m.height;
    // Resample to S×S in case the mask comes back at model resolution.
    const out = new Float32Array(S * S);
    for (let y = 0; y < S; y++) for (let x = 0; x < S; x++)
      out[y * S + x] = src[((y * mh / S) | 0) * mw + ((x * mw / S) | 0)];
    res.close?.();
    return out;
  } catch (e) { console.warn('segment failed', e); return null; }
}

async function loadImage(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    img.src = url;
    await img.decode();
    return img;
  } finally { URL.revokeObjectURL(url); }
}

async function process(file) {
  show('preview');
  $('send').disabled = true;
  $('status').textContent = '워홀의 공정을 실행하는 중…';
  const out = $('out').getContext('2d');
  out.fillStyle = '#fff'; out.fillRect(0, 0, 600, 600);
  try {
    const img = await loadImage(file);
    // Center-crop to a square at tile size.
    const src = document.createElement('canvas');
    src.width = src.height = S;
    const side = Math.min(img.naturalWidth, img.naturalHeight);
    src.getContext('2d').drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, S, S);
    const rgba = src.getContext('2d').getImageData(0, 0, S, S).data;

    const lv = levels(luminance(rgba, S, S), await personMask(src), S, S);
    PALETTES.forEach((p, i) => {
      out.putImageData(new ImageData(renderTile(lv, S, S, p, OFFSETS[i]), S, S), (i % 2) * S, (i >> 1) * S);
    });
    $('status').textContent = '고대비 → 평면 색 → 2×2 반복. 마음에 들면 보내 주세요.';
    $('send').disabled = false;
  } catch (e) {
    console.error(e);
    $('status').textContent = '사진을 읽지 못했어요. 다시 찍어 주세요.';
  }
}

for (const id of ['cam', 'pick']) $(id).addEventListener('change', (e) => {
  const f = e.target.files?.[0];
  e.target.value = '';
  if (f) process(f);
});
$('retake').addEventListener('click', () => show('shoot'));

$('send').addEventListener('click', async () => {
  $('send').disabled = true;
  $('status').textContent = '보내는 중…';
  try {
    const blob = await new Promise((r) => $('out').toBlob(r, 'image/jpeg', 0.85));
    const res = await fetch('/api/photo', { method: 'POST', headers: { 'content-type': 'image/jpeg', 'x-cid': cid }, body: blob });
    if (!res.ok) throw new Error(await res.text());
    show('vote');
  } catch (e) {
    console.error(e);
    $('status').textContent = '보내지 못했어요. 잠시 후 다시 눌러 주세요.';
    $('send').disabled = false;
  }
});

async function vote(answer, missing) {
  try {
    await fetch('/api/vote', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ cid, answer, missing }) });
  } catch (e) { console.error(e); }
  show('done');
}
document.querySelectorAll('[data-answer]').forEach((b) => b.addEventListener('click', () => {
  if (b.dataset.answer === 'no') show('missing'); else vote(b.dataset.answer);
}));
document.querySelectorAll('[data-missing]').forEach((b) => b.addEventListener('click', () => vote('no', b.dataset.missing)));
</script>
</body>
</html>
