<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffd400">
<title>워홀 필터</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://storage.googleapis.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap">
<style>
  :root {
    --ink: #1b1b1b; --paper: #fffaf0;
    --pink: #ff4fa0; --yellow: #ffd400; --cyan: #18c3d6; --orange: #ff7a1a;
    --display: "Black Han Sans", "Apple SD Gothic Neo", sans-serif;
    --body: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    --muted: #5b544a;
    /* Black Han Sans ink sits 0.09em above the line box center (ascent 79, descent 21, Hangul ink 0–76);
       shifting padding by this much centers the glyphs, not the box. */
    --nudge: .09em;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100dvh; color: var(--ink); font: 16px/1.55 var(--body);
    background-color: var(--yellow);
    /* Ben-Day dots */
    background-image: radial-gradient(rgba(255, 79, 160, .55) 22%, transparent 24%);
    background-size: 14px 14px;
    touch-action: manipulation;
    word-break: keep-all; overflow-wrap: anywhere; /* break Korean at word boundaries */
  }
  main {
    max-width: 460px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column;
    padding: max(20px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  section { display: flex; flex-direction: column; gap: 20px; flex: 1; }
  [hidden] { display: none !important; }

  .masthead { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  .tag {
    display: inline-flex; align-items: center; min-height: 28px; border-radius: 6px;
    padding: calc(6px + var(--nudge)) 10px calc(6px - var(--nudge));
    font: 13px/1 var(--display); background: var(--ink); color: var(--yellow); letter-spacing: .02em;
  }
  .steps { display: flex; gap: 6px; flex: none; }
  .steps i {
    display: grid; place-items: center; width: 28px; height: 28px; padding-top: calc(var(--nudge) * 2);
    border: 3px solid var(--ink); border-radius: 50%; background: var(--paper);
    font: 13px/1 var(--display); font-style: normal;
  }
  .steps i.on { background: var(--pink); color: #fff; }

  h1, h2 { font-family: var(--display); font-weight: 400; margin: 0; letter-spacing: -.01em; }
  h1 { font-size: clamp(52px, 17vw, 76px); line-height: 1; color: var(--paper); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 5px 5px 0 var(--ink); }
  h2 { font-size: clamp(32px, 9.5vw, 42px); line-height: 1.15; }

  /* Text inside panels: one lead line, then quieter notes. */
  .panel { background: var(--paper); border: 3px solid var(--ink); border-radius: 14px; padding: 18px 20px; box-shadow: 6px 6px 0 var(--ink); }
  .panel p { margin: 0; }
  .lead { font-size: 19px; line-height: 1.4; font-weight: 700; letter-spacing: -.01em; }
  .note { font-size: 14px; line-height: 1.55; color: var(--muted); }
  .note + .lead { margin-top: 6px; }
  .lead + .note { margin-top: 12px; padding-top: 12px; border-top: 2px dashed rgba(27, 27, 27, .18); }
  .note + .note { margin-top: 4px; }
  .warn { background: var(--cyan); font-size: 15px; line-height: 1.5; }

  .btn {
    display: flex; align-items: center; justify-content: center; width: 100%; min-height: 58px;
    padding: calc(14px + var(--nudge)) 20px calc(14px - var(--nudge));
    font: 21px/1.15 var(--display); text-align: center; color: var(--ink); background: var(--paper);
    border: 3px solid var(--ink); border-radius: 14px; box-shadow: 6px 6px 0 var(--ink);
    cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; transition: transform .06s, box-shadow .06s;
  }
  .btn:active { transform: translate(4px, 4px); box-shadow: 2px 2px 0 var(--ink); }
  .btn:focus-visible { outline: 4px solid var(--cyan); outline-offset: 3px; }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn.pink { background: var(--pink); color: #fff; }
  .btn.cyan { background: var(--cyan); }
  .btn.orange { background: var(--orange); }
  .btn.big { min-height: 70px; font-size: 25px; }
  .stack { display: flex; flex-direction: column; gap: 14px; margin-top: auto; padding-top: 8px; }

  .frame { position: relative; border: 4px solid var(--ink); border-radius: 6px; box-shadow: 8px 8px 0 var(--ink); background: var(--paper); overflow: hidden; }
  canvas { display: block; width: 100%; height: auto; aspect-ratio: 1; }
  .busy::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(var(--ink) 20%, transparent 22%) 0 0 / 16px 16px, var(--yellow);
    animation: dots 0.8s steps(4) infinite;
  }
  @keyframes dots { to { background-position: 16px 16px, 0 0; } }
  .status { margin: 0; font: 20px/1.2 var(--display); text-align: center; min-height: 24px; }

  input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  /* Screen change: a black print pass with cyan/pink edges sweeps across and the screen swaps under it.
     The band is wider than the screen plus its skew, so it fully covers the swap at the midpoint. */
  #wipe {
    position: fixed; top: 0; bottom: 0; left: 0; width: 300vw; z-index: 20; pointer-events: none; background: var(--ink);
    box-shadow: -16px 0 0 var(--cyan), -32px 0 0 var(--pink), 16px 0 0 var(--pink), 32px 0 0 var(--cyan);
    transform: translateX(-340vw) skewX(-14deg);
  }
  #wipe.go { animation: wipe .64s linear; }
  /* slide in, hold while covering (the swap happens here), slide out */
  @keyframes wipe {
    0%   { transform: translateX(-320vw) skewX(-14deg); animation-timing-function: cubic-bezier(.5, 0, .9, .5); }
    40%  { transform: translateX(-110vw) skewX(-14deg); animation-timing-function: linear; }
    60%  { transform: translateX(-90vw) skewX(-14deg); animation-timing-function: cubic-bezier(.1, .5, .5, 1); }
    100% { transform: translateX(120vw) skewX(-14deg); }
  }
  /* Then the new screen's parts pop in one after another. */
  section.enter > * { animation: rise .45s cubic-bezier(.34, 1.56, .64, 1) both; }
  section.enter > :nth-child(2) { animation-delay: .06s; }
  section.enter > :nth-child(3) { animation-delay: .12s; }
  section.enter > :nth-child(4) { animation-delay: .18s; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.94) rotate(-1.5deg); } }
  @media (prefers-reduced-motion: reduce) {
    .busy::after, section.enter > * { animation: none; } .btn { transition: none; } #wipe { display: none; }
  }
</style>
</head>
<body>
<main>
  <div class="masthead">
    <span class="tag">팝아트 · 임정훈, 김서윤, 박소희</span>
    <span class="steps" aria-hidden="true"><i data-step="1">1</i><i data-step="2">2</i><i data-step="3">3</i></span>
  </div>

  <section id="shoot" data-step="1">
    <h1>Warhol<br>Filter</h1>
    <div class="panel">
      <p class="lead">셀카를 한 장 찍거나 선택해 주세요.</p>
      <p class="note">필터 처리가 완료된 사진만 전송되며, 수업 이후 삭제할 예정입니다.</p>
      <p class="note">부담스럽다면 반려동물이나 인터넷에서 찾은 사진도 괜찮아요!</p>
    </div>
    <div id="inapp" class="panel warn" hidden>
      카카오톡 안에서는 카메라가 열리지 않을 수 있어요. 오른쪽 위 메뉴를 눌러 다른 브라우저로 열어 주세요.
    </div>
    <div class="stack">
      <label class="btn pink big" for="cam">사진 찍기</label>
      <input id="cam" type="file" accept="image/*" capture="user">
      <label class="btn" for="pick">앨범에서 고르기</label>
      <input id="pick" type="file" accept="image/*">
      <!-- <p class="small" style="margin:0;text-align:center"><span style="background:var(--paper);padding:3px 8px;border-radius:4px">사진은 발표 시간에만 띄우고, 수업이 끝나면 지웁니다.</span></p> -->
    </div>
  </section>

  <section id="preview" data-step="2" hidden>
    <div id="frame" class="frame"><canvas id="out" width="600" height="600" aria-label="필터를 입힌 사진"></canvas></div>
    <p id="status" class="status" role="status"></p>
    <div class="stack">
      <button id="send" class="btn pink big" disabled>앞의 스크린에 보내기</button>
      <button id="retake" class="btn">다시 찍기</button>
    </div>
  </section>

  <section id="vote" data-step="3" hidden>
    <h2>질문</h2>
    <div class="panel">
      <p class="note">방금 사진은 워홀이 쓰던 방식 그대로 만들었어요.</p>
      <p class="lead">그럼 이 사진도 워홀의 작품일까요?</p>
    </div>
    <div class="stack">
      <button class="btn cyan big" data-answer="yes">그렇다</button>
      <button class="btn pink big" data-answer="no">아니다</button>
      <button class="btn" data-answer="unsure">잘 모르겠다</button>
    </div>
  </section>

  <section id="missing" data-step="3" hidden>
    <h2>그럼 어떤 것이<br>부족할까요?</h2>
    <div class="stack">
      <button class="btn orange" data-missing="choice">무엇을 고를지 정한 이유</button>
      <button class="btn cyan" data-missing="context">그 시대의 맥락</button>
      <button class="btn" data-missing="hand">작가의 손길</button>
    </div>
  </section>

  <section id="done" data-step="3" hidden>
    <h1>감사합니다!</h1>
    <div class="panel"><p class="lead">이제 앞의 스크린을 봐 주세요.</p></div>
  </section>
</main>
<div id="wipe" aria-hidden="true"></div>

<script type="module">
import { warholize } from './filter.js';

const S = 300; // tile size; output is 2×2 tiles
const $ = (id) => document.getElementById(id);
let swapTimer;
function show(id, animate = true) {
  const swap = () => {
    document.querySelectorAll('main > section').forEach((s) => { s.hidden = s.id !== id; s.classList.remove('enter'); });
    const step = $(id).dataset.step;
    document.querySelectorAll('.steps i').forEach((i) => i.classList.toggle('on', i.dataset.step <= step));
    scrollTo(0, 0);
    if (animate) { void $(id).offsetWidth; $(id).classList.add('enter'); } // reflow restarts the pop-in
  };
  clearTimeout(swapTimer);
  if (!animate || matchMedia('(prefers-reduced-motion: reduce)').matches) return swap();
  const w = $('wipe');
  w.classList.remove('go'); void w.offsetWidth; w.classList.add('go');
  swapTimer = setTimeout(swap, 320); // middle of the hold (40–60% of 0.64 s), band covers the screen
}
show('shoot', false);

let cid;
try { cid = localStorage.getItem('cid') || crypto.randomUUID(); localStorage.setItem('cid', cid); }
catch { cid = crypto.randomUUID(); }

if (/KAKAOTALK|Instagram|FBAN|FBAV|Line\//i.test(navigator.userAgent)) $('inapp').hidden = false;

// Person segmentation starts loading on page open, while people are still reading the page.
const segmenterReady = (async () => {
  const v = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
  const { FilesetResolver, ImageSegmenter } = await import(`${v}/vision_bundle.mjs`);
  const fileset = await FilesetResolver.forVisionTasks(`${v}/wasm`);
  return ImageSegmenter.createFromOptions(fileset, {
    baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite' },
    runningMode: 'IMAGE', outputConfidenceMasks: true, outputCategoryMask: false,
  });
})().catch((e) => { console.warn('segmenter unavailable', e); return null; });

// On a slow connection don't make people wait: after 6 s, go without the background cut.
const withTimeout = (p, ms) => Promise.race([p, new Promise((r) => setTimeout(() => r(null), ms))]);

async function personMask(canvas) {
  const seg = await withTimeout(segmenterReady, 6000);
  if (!seg) return null;
  try {
    const res = seg.segment(canvas);
    const m = res.confidenceMasks?.[0];
    if (!m) return null;
    const src = m.getAsFloat32Array(), mw = m.width, mh = m.height;
    // Resample to S×S in case the mask comes back at model resolution.
    const out = new Float32Array(S * S);
    for (let y = 0; y < S; y++) for (let x = 0; x < S; x++)
      out[y * S + x] = src[((y * mh / S) | 0) * mw + ((x * mw / S) | 0)];
    res.close?.();
    return out;
  } catch (e) { console.warn('segment failed', e); return null; }
}

async function loadImage(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    img.src = url;
    await img.decode();
    return img;
  } finally { URL.revokeObjectURL(url); }
}

let blob = null; // encoded right after rendering, so the upload button sends immediately

async function process(file) {
  show('preview');
  blob = null;
  $('send').disabled = true;
  $('frame').classList.add('busy');
  $('status').textContent = '바꾸는 중';
  try {
    const img = await loadImage(file);
    // Square crop at tile size. Portrait shots crop nearer the top so the head isn't cut off.
    const src = document.createElement('canvas');
    src.width = src.height = S;
    const sctx = src.getContext('2d', { willReadFrequently: true });
    const side = Math.min(img.naturalWidth, img.naturalHeight);
    sctx.drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) * 0.2, side, side, 0, 0, S, S);
    const rgba = sctx.getImageData(0, 0, S, S).data;

    // A new seed per photo: every print gets its own offsets and ink, like a fresh pull.
    const tiles = warholize(rgba, await personMask(src), S, (Math.random() * 2 ** 32) >>> 0);
    const out = $('out').getContext('2d');
    tiles.forEach((t, i) => out.putImageData(new ImageData(t, S, S), (i % 2) * S, (i >> 1) * S));
    $('frame').classList.remove('busy');
    $('status').textContent = '이렇게 바뀌었어요';
    // Flat colors compress well; ~60–120 KB at this quality.
    blob = await new Promise((r) => $('out').toBlob(r, 'image/jpeg', 0.82));
    $('send').disabled = false;
  } catch (e) {
    console.error(e);
    $('frame').classList.remove('busy');
    $('status').textContent = '사진을 읽지 못했어요. 다시 찍어 주세요.';
  }
}

for (const id of ['cam', 'pick']) $(id).addEventListener('change', (e) => {
  const f = e.target.files?.[0];
  e.target.value = '';
  if (f) process(f);
});
$('retake').addEventListener('click', () => show('shoot'));

$('send').addEventListener('click', async () => {
  if (!blob) return;
  $('send').disabled = true;
  $('status').textContent = '올리는 중';
  try {
    const res = await fetch('/api/photo', { method: 'POST', headers: { 'content-type': 'image/jpeg', 'x-cid': cid }, body: blob });
    if (!res.ok) throw new Error(await res.text());
    show('vote');
  } catch (e) {
    console.error(e);
    $('status').textContent = '올리지 못했어요. 한 번 더 눌러 주세요.';
    $('send').disabled = false;
  }
});

function vote(answer, missing) {
  // Fire and forget: the next screen doesn't depend on the reply.
  fetch('/api/vote', { method: 'POST', keepalive: true, headers: { 'content-type': 'application/json' }, body: JSON.stringify({ cid, answer, missing }) })
    .catch(console.error);
  show('done');
}
document.querySelectorAll('[data-answer]').forEach((b) => b.addEventListener('click', () => {
  if (b.dataset.answer === 'no') show('missing'); else vote(b.dataset.answer);
}));
document.querySelectorAll('[data-missing]').forEach((b) => b.addEventListener('click', () => vote('no', b.dataset.missing)));
</script>
</body>
</html>
