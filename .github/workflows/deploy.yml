name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy # never run two deploys at once

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Until the token secret is added, stop after the tests instead of failing.
      - if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN secret not set; skipping deploy"
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler d1 migrations apply warhol-ar --remote
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
